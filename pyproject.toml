[tool.poetry]
package-mode = false

[project]
name = "nsreg-production"
version = "0.1.0"
description = "Domain registrar price monitoring system"
authors = [
    {name = "poligrafo", email = "poligrafo888@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "scrapy==2.11.0",
    "psycopg2-binary>=2.9.9,<3",
    "django==4.1.7",
    "django-debug-toolbar==4.0.0",
    "aiogram>=3.7,<4",
    "python-dotenv==1.0.0",
]

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"